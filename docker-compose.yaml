services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mypassword
    volumes:
      - mongodb_data:/data/db

  api:
    build: .
    container_name: fastapi_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Connects to 'mongodb' service container
      - MONGODB_URI=mongodb://root:mypassword@mongodb:27017/
    depends_on:
      - mongodb
    volumes:
      - ./app/uploads:/app/app/uploads

volumes:
  mongodb_data: